# Manim configuration for the LMS video generator.
#
# Manim reads this file automatically when you run it from the project root
# (the render scripts in scripts/ always do this for you).
#
# These defaults favour FAST development renders (480p, 15 fps).
# Quality is overridden per render with a CLI flag:
#   -ql  low     854x480   @ 15 fps   (quick previews, the default here)
#   -qm  medium  1280x720  @ 30 fps   (checking timing and detail)
#   -qh  high    1920x1080 @ 60 fps   (final Full HD output)
# All presets are 16:9 landscape.

[CLI]
# Default resolution/frame rate when no quality flag is given (same as -ql).
pixel_width = 854
pixel_height = 480
frame_rate = 15

# Brand background colour. Keep in sync with BACKGROUND in
# src/themes/default_theme.py (tests/test_environment.py checks this).
background_color = #0E1726

# Everything Manim writes (videos, frames, TeX cache, partial clips) goes here.
# The render scripts override this per lesson: output/media/<lesson_name>/
media_dir = output/media

# Cached animation clips kept per scene. The generator relies on this cache to
# re-render only the animations that changed; Manim's default (100) would
# evict clips from longer lessons.
max_files_cached = 5000
